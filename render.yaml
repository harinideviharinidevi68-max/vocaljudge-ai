services:
  - type: web
    name: vocaljudge-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt && python scripts/generate_synthetic_samples.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
